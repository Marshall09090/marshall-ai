plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.marshallai'
version = '0.0.1-SNAPSHOT'
description = 'marshall-ai'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    /*
     * ---------------------------------------------------------
     * Application
     * ---------------------------------------------------------
     */

    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    /*
     * Workload 5 durable governance store.
     *
     * We are deliberately using JDBC rather than JPA for the
     * protected-run guard/ledger because the governance contract
     * requires explicit conditional UPDATE statements and tightly
     * controlled transactions.
     */
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    /*
     * Schema versioning.
     */
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    /*
     * Durable production database driver.
     */
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    /*
     * ---------------------------------------------------------
     * Tests
     * ---------------------------------------------------------
     */

    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    /*
     * Spring Boot integration with Testcontainers.
     */
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'

    /*
     * Real PostgreSQL integration testing.
     */
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
    testImplementation 'org.testcontainers:testcontainers-postgresql:2.0.5'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    /*
     * Cucumber BDD.
     */
    testImplementation 'io.cucumber:cucumber-java:7.20.1'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.20.1'
    testImplementation 'io.cucumber:cucumber-spring:7.20.1'

    testImplementation 'org.junit.platform:junit-platform-suite:1.11.4'
}

tasks.named('test') {
    useJUnitPlatform()
}